<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa-Formulario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pesquisa Online</h1>
  </header>
  <section>
    <form action="" method="get">
      <fieldset> 
              <!-- Dados Pessoais -->
              
         <legend>Dados Pessoais</legend>    
       <label for="userName">Nome</label>
        <input id="userName" type="text" name="userName" required>
        <br>
        <label for="userAge">Idade</label>
        <input id="userAge" type="number" name="userAge" min="12" max="100" required>
        <br>        
        <label for="birthDate">Data de nascimento</label>
        <input type="date" name="birthDate" required>
        <br>
        <label for="userEmail">Email</label>
        <input id="userEmail" type="email" name="userEmail" required>
        <br> 
        <label for="userNumberPhone">Telefone</label>
        <input id="userNumberPhone" type="tel" name="userNumberPhone" pattern="[0-9]{11}" placeholder="DDD+ (00) 000000000">
        <br>
        <label for="userImage">Upload de foto</label>
        <input type="file" accept="image/*" name="userImage">
        <br> 
      </fieldset>
    
        <fieldset>
          <legend>Perfil</legend>
          
          <!-- Genero -->
          <p>Genero:</p>
          <input id="Feminino" type="radio" name="Genero" value="Feminino">
          <label for="Feminino">Feminino</label>
          <input id="Masculino" type="radio" name="Genero" value="Masculino">
          <label for="Masculino">Masculino</label>
          <input id="notInformed" type="radio" name="Genero" value="notInformed">
          <label for="notInformed">Prefiro nao informar</label>
          <br>

          <!-- Estado Civil -->
          <label for="maritalStatus">Estado civil:</label>
          <select id="maritalStatus" name="maritalStatus">
            <option value="notInformed">Selecione...</option>
            <option value="Casado">Casado</option>
            <option value="Solteiro">Solteiro</option>
            <option value="Divorciado">Divorciado</option>
          </select>
          <label for="userState">Estado:</label>

          <!-- Estado Nascido -->
      <select id="userState" name="userState" required>
          <option value="notInformed">Selecione...</option>
          <option value="acre">Acre</option>
          <option value="alagoas">Alagoas</option>
          <option value="amapá">Amapá</option>
          <option value="amazonas">Amazonas</option>
          <option value="bahia">Bahia</option>
          <option value="ceara">Ceará</option>
          <option value="distritoFederal">Distrito Federal</option>
          <option value="espiritoSanto">Espirito Santo</option>
          <option value="goias">Goiás</option>
          <option value="maranhão">Maranhão</option>
          <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
          <option value="matoGrosso">Mato Grosso</option>
          <option value="minasGerais">Minas Gerais</option>
          <option value="para">Pará</option>
          <option value="paraiba">Paraíba</option>
          <option value="parana">Paraná</option>
          <option value="pernambuco">Pernambuco</option>
          <option value="piaui">Piauí</option>
          <option value="rioDeJaneiro">Rio de Janeiro</option>
          <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
          <option value="rioGrandeDoSul">Rio Grande do Sul</option>
          <option value="rondonia">Rondônia</option>
          <option value="roraima">Roraima</option>
          <option value="santaCatarina">Santa Catarina</option>
          <option value="saoPaulo">São Paulo</option>
          <option value="sergipe">Sergipe</option>
          <option value="tocantins">Tocantins</option>
      </select>

      <label for="userCity">Cidade:</label>
      <input id="userCity" type="text" id="userCity" name="userCity" autocomplete="address-level2" placeholder="Ex.: Acre">
        </fieldset> 
      
      
      <fieldset>
        <legend>Hábitos</legend>
        <p>Redes Sociais:</p>
        <input id="Instagram" type="checkbox" name="Instagram" value="Instagram">
        <label for="Instagram">Instagram</label>
        <br>
        <input id="Facebook" type="checkbox" name="Facebook" value="Facebook">
        <label for="Facebook">Facebook</label>
        <br>
        <input id="Linkedin" type="checkbox" name="Linkedin" value="Linkedin">
        <label for="Linkedin">Linkedin</label>
        <br>
        <input id="X" type="checkbox" name="X" value="X">
        <label for="X">X</label>
        <br>
        <br>
        <label for="musicStyle">Estilo Musical:</label>
        <input list="styleTypes" id="musicStyle" name="musicStyle" type="text">
        <datalist id="styleTypes">
          <option value="Rock">
          <option value="Pop">
          <option value="Samba">
          <option value="Sertanejo">
        </datalist>
        <br>
        
        <label for="favoriteColor">Cor favorita</label>
        <input type="color" name="userFavoriteColor" id="favoriteColor">
      
      </fieldset>
      
      <fieldset>
        <legend>Feedback</legend>
        <p>Satisfação:</p>
        <input type="radio" name="Feedback" id="otimo" value="ótima">
        <label for="otimo">Ótima</label>

        <input type="radio" name="Feedback" id="boa" value="boa">
        <label for="boa">Boa</label>

        <input type="radio" name="Feedback" id="regular" value="regular">
        <label for="regular">Regular</label>

        <input type="radio" name="Feedback" id="ruim" value="ruim">
        <label for="ruim">Ruim</label>
        <br>
        <br>
        <label for="comentario">Comentario:</label><br>
        <textarea name="userComentario" id="comentario" placeholder="Escreva aqui sua opinião..."></textarea>

      </fieldset>
      
      <fieldset>
        <legend>Confirmações</legend>

        <input type="checkbox" name="userLgpd" id="userLgpdterm" value="confirmed" required>
        <label for="userLgpdterm">Eu aceito participar da pesquisa</label><br>

        <input type="checkbox" name="userGetResult" id="getResult" value="confirmed">
        <label for="userLgpdterm">Desejo receber o resultado por e-mail.</label><br>
      </fieldset>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
  </section>
</body>
</html>
